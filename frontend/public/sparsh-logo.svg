<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141428" />
      <stop offset="50%" stop-color="#0c0c1a" />
      <stop offset="100%" stop-color="#05050d" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#00C9A7" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#FFB800" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Main 'S' Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="25%" stop-color="#6C63FF" />
      <stop offset="55%" stop-color="#00C9A7" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Hand Palm Support Gradient -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="50%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Golden Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="starBlur" />
      <feComposite in="SourceGraphic" in2="starBlur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Outer Glass Housing -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.85" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Background Ambient Glow Aura -->
  <circle cx="256" cy="220" r="140" fill="#6C63FF" opacity="0.18" filter="url(#starGlow)" />
  <circle cx="256" cy="360" r="110" fill="#00C9A7" opacity="0.14" filter="url(#starGlow)" />

  <!-- Lower Supportive Hand Palm Curve (Tactile Sensation / Sparsh) -->
  <path d="M 160 330 
           C 160 380, 210 405, 275 405 
           C 340 405, 375 375, 395 345
           C 400 338, 385 330, 375 338
           C 350 360, 325 375, 275 375
           C 225 375, 195 355, 195 325
           C 195 295, 245 280, 290 265
           Z" 
        fill="url(#handGrad)" 
        opacity="0.95" 
        filter="url(#coreGlow)" />

  <!-- Interconnected Flowing Ribbon 'S' -->
  <path d="M 325 185
           C 350 205, 355 240, 335 268
           C 310 300, 260 310, 225 325
           C 180 345, 155 365, 160 395
           C 165 425, 215 440, 275 435
           C 320 430, 370 405, 395 370
           C 405 356, 390 346, 380 358
           C 355 390, 315 410, 270 412
           C 220 415, 185 400, 182 380
           C 178 355, 205 338, 245 322
           C 295 302, 350 285, 362 242
           C 374 200, 350 165, 310 152
           Z"
        fill="url(#ribbonGrad)" 
        filter="url(#coreGlow)" />

  <!-- Upper Graceful Arc Towards the Star -->
  <path d="M 190 170
           C 175 200, 180 235, 205 258
           C 230 280, 280 295, 320 310
           C 335 316, 342 300, 328 294
           C 290 280, 245 265, 225 245
           C 200 220, 198 190, 212 165
           C 225 140, 255 125, 295 125
           C 335 125, 365 145, 380 170
           C 388 182, 402 172, 394 160
           C 375 130, 338 105, 290 105
           C 238 105, 198 128, 190 170
           Z"
        fill="url(#ribbonGrad)" 
        opacity="0.9" />

  <!-- Center Golden Star of Knowledge & Empowerment -->
  <g filter="url(#starGlow)">
    <polygon points="256,120 274,166 324,168 285,198 298,246 256,218 214,246 227,198 188,168 238,166" 
             fill="url(#starGrad)" />
  </g>

  <!-- Star Center Diamond Sparkle -->
  <circle cx="256" cy="180" r="8" fill="#FFFFFF" opacity="0.9" />

  <!-- Subtle Constellation / Sensory Touch Dots -->
  <circle cx="165" cy="130" r="4" fill="#A78BFA" opacity="0.6" />
  <circle cx="355" cy="120" r="5" fill="#FDE047" opacity="0.7" />
  <circle cx="410" cy="270" r="4.5" fill="#00C9A7" opacity="0.65" />
  <circle cx="130" cy="320" r="5" fill="#38BDF8" opacity="0.6" />
</svg>
