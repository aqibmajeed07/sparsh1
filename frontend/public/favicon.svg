<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sparshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00C9A7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6C63FF" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#sparshGrad)" filter="url(#shadow)"/>
  
  <!-- Inner Glow Accent -->
  <rect x="7" y="7" width="86" height="86" rx="22" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Stylized Modern Letter "S" for Sparsh -->
  <path d="M64 34 C64 26 58 22 50 22 C40 22 34 27 34 35 C34 44 42 47 50 50 C60 53 66 57 66 66 C66 75 58 80 48 80 C38 80 32 74 32 65 M32 65" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Subtle Sparkle Dot on Top-Right -->
  <circle cx="70" cy="24" r="5" fill="#FFE600" />
</svg>
